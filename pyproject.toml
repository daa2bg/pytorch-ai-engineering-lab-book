[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-ai-engineering-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "jupyterlab>=4", "ipykernel>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbclient>=0.10", "nbformat>=5.10"]
book = ["pandas>=2,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "transformers>=4.54,<5", "tokenizers>=0.21,<0.23", "huggingface-hub>=0.34,<1", "datasets>=3,<5", "accelerate>=1.9,<2", "peft>=0.17,<0.19", "sentencepiece>=0.2,<0.3", "fastapi>=0.110,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
