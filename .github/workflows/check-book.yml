name: Check the public book
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AI_LAB_ALLOW_DOWNLOADS: '0'
      USE_TF: '0'
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[book,dev]'
      - run: python -m pytest -q
      - run: python tools/build_ch02_notebook.py --check
      - run: python tools/book_factory.py build
      - run: python tools/assemble_book.py
      - run: git diff --exit-code -- book
